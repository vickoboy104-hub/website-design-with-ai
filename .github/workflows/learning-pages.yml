name: Publish learning website
on:
  push:
    paths: ['docs/**', '.github/workflows/learning-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: learning-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check practical pages and copying
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8000 --directory docs &
          node <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch();const c=await b.newContext({viewport:{width:390,height:844},permissions:['clipboard-read','clipboard-write']});const p=await c.newPage();await p.goto('http://localhost:8000');const data=await p.evaluate(()=>COURSE);let count=0;
          for(const project of data.projects){await p.goto('http://localhost:8000/#project/'+project.id);await p.locator('details').evaluateAll(ds=>ds.forEach(d=>d.open=true));await p.locator('[data-copy]').first().click();const copied=await p.evaluate(()=>navigator.clipboard.readText());if(copied!==project.files[0].code)throw Error('Copy differs '+project.id);if(await p.evaluate(()=>document.documentElement.scrollWidth>innerWidth))throw Error('Overflow '+project.id);if(project.live){await p.goto('http://localhost:8000/'+project.live);if(!await p.locator('h1').count())throw Error('Missing page '+project.id);count++;}}
          for(const s of data.snippets){await p.goto('http://localhost:8000/#sample/'+s.id);if(await p.locator('pre').textContent()!==s.code)throw Error('Snippet differs '+s.id);}
          await p.goto('http://localhost:8000/examples/javascript-1/index.html');await p.locator('#name').fill('Ada');await p.locator('#greet').click();if(!await p.locator('#result').textContent().then(x=>x.includes('Ada')))throw Error('Greeting failed');
          await p.goto('http://localhost:8000/examples/javascript-2/index.html');await p.locator('#quantity').fill('10');await p.locator('#calculate').click();if(!await p.locator('#result').textContent())throw Error('Estimate failed');
          await p.goto('http://localhost:8000/#home');await p.screenshot({path:'code-lab-mobile.png',fullPage:true});console.log('PASS: '+count+' live examples, '+data.projects.length+' file-copy checks, '+data.snippets.length+' exact snippets.');await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: code-lab-mobile-preview
          path: code-lab-mobile.png
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deploy
