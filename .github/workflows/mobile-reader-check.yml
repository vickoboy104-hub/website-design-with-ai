name: Verify mobile course reader
on:
  push:
    paths: ['.github/workflows/mobile-reader-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install playwright && npx playwright install --with-deps chromium
      - name: Check phone reader
        run: |
          mkdir -p reader-checks
          cat > check.cjs <<'JS'
          const {chromium}=require('playwright');const {spawn}=require('child_process');const fs=require('fs');
          (async()=>{const server=spawn('python3',['-m','http.server','8090'],{stdio:'ignore'});
          const b=await chromium.launch();const ctx=await b.newContext({viewport:{width:390,height:844},permissions:['clipboard-read','clipboard-write']});const p=await ctx.newPage();
          const errors=[];p.on('pageerror',e=>errors.push(e.message));
          await p.goto('http://127.0.0.1:8090/downloads/Website_Design_Mobile_Reader.html');
          const ids=await p.locator('article').evaluateAll(a=>a.map(x=>x.id));const overflow=[];
          for(const id of ids){await p.evaluate(id=>{location.hash=id},id);await p.waitForFunction(id=>!document.getElementById(id).hidden,id);if(await p.evaluate(()=>document.documentElement.scrollWidth>innerWidth))overflow.push(id);}
          if(overflow.length)throw Error('Overflow '+overflow.join(','));
          await p.evaluate(id=>location.hash=id,ids[0]);await p.screenshot({path:'reader-checks/start.png',fullPage:true});
          const codeLesson=await p.locator('article:has(pre)').first().getAttribute('id');
          await p.evaluate(id=>location.hash=id,codeLesson);await p.waitForFunction(id=>!document.getElementById(id).hidden,codeLesson);
          const code=await p.locator('article:not([hidden]) pre code').first().textContent();await p.locator('article:not([hidden]) .copy').first().click();
          if(await p.evaluate(()=>navigator.clipboard.readText())!==code)throw Error('Clipboard mismatch');
          await p.screenshot({path:'reader-checks/code.png',fullPage:true});
          await p.locator('#prefs').click();await p.locator('#size').fill('26');await p.locator('#size').dispatchEvent('input');await p.locator('#settings .close').click();
          const font=await p.locator('article:not([hidden]) pre').evaluate(x=>getComputedStyle(x).fontSize);if(font!=='12.6667px')throw Error('Code font changed: '+font);
          await p.locator('article:not([hidden]) .complete').click();await p.reload();if(!await p.locator('article:not([hidden]) .complete').textContent().then(x=>x.includes('Completed')))throw Error('Progress not saved');
          await p.locator('#menu').click();await p.locator('#search').fill('PHP practical 4');await p.screenshot({path:'reader-checks/contents.png',fullPage:true});
          if(errors.length)throw Error(errors.join(';'));
          fs.writeFileSync('reader-checks/result.json',JSON.stringify({lessons:ids.length,overflow,copy:'passed',codeSizeUnchanged:true,progress:'passed',errors},null,2));await b.close();server.kill();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-reader-checks
          path: reader-checks/
