<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>A workshop registration form</title>
</head>
<body>
<main>
  <h1>Register for a sewing workshop</h1>
  <form action="index.html" method="get">
    <label for="name">First name</label>
    <input id="name" name="name" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="level">Your level</label>
    <select id="level" name="level">
      <option value="new">Complete beginner</option>
      <option value="some">Some experience</option>
    </select>
    <label for="note">What would you like to learn?</label>
    <textarea id="note" name="note"></textarea>
    <button type="submit">Try registration</button>
  </form>
</main>
</body>
</html>
