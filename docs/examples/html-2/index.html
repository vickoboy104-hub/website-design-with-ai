<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>A restaurant menu page</title>
</head>
<body>
<header><h1>Market Kitchen</h1></header>
<main>
  <h2>Lunch menu</h2>
  <table>
    <caption>Sample prices in NGN</caption>
    <tr><th scope="col">Meal</th><th scope="col">Price</th></tr>
    <tr><td>Jollof rice</td><td>2500</td></tr>
    <tr><td>Vegetable soup</td><td>3000</td></tr>
  </table>
  <h2>How to order</h2>
  <ol><li>Choose a meal.</li><li>Ask the attendant.</li></ol>
</main>
<footer><p>Classroom menu only.</p></footer>
</body>
</html>
